<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Image &amp; Photography">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e4d"/>
      <stop offset=".54" stop-color="#539592"/>
      <stop offset="1" stop-color="#8b2f43"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <path d="M0 240 C200 200 400 250 640 210 C880 170 1080 230 1280 200 L1280 320 L0 320 Z" fill="#ffffff" opacity=".16"/>
  <!-- Camera body -->
  <g transform="translate(620,155)" opacity=".25">
    <rect x="-80" y="-52" width="160" height="104" rx="12" fill="#ffffff"/>
    <!-- Lens -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#539592" stroke-width="8"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#539592" stroke-width="5"/>
    <circle cx="0" cy="0" r="12" fill="#539592"/>
    <!-- Viewfinder bump -->
    <rect x="-24" y="-64" width="48" height="16" rx="6" fill="#ffffff"/>
    <!-- Flash -->
    <circle cx="56" cy="-36" r="8" fill="#539592"/>
  </g>
  <!-- Aperture iris left -->
  <g transform="translate(200,150)" opacity=".20">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity=".5"/>
  </g>
  <!-- Aperture iris right -->
  <g transform="translate(1060,150)" opacity=".20">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity=".5"/>
  </g>
  <!-- Star/flash burst -->
  <g transform="translate(950,80)" opacity=".18">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-21" y1="-21" x2="21" y2="21" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="-21" x2="-21" y2="21" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
