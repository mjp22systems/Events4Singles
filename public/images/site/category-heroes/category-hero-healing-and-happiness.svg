<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Healing &amp; Happiness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e4d"/>
      <stop offset=".54" stop-color="#539592"/>
      <stop offset="1" stop-color="#8b2f43"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <path d="M0 222 C170 180 330 242 520 202 C720 160 880 236 1280 182 L1280 320 L0 320 Z" fill="#ffffff" opacity=".18"/>
  <!-- Lotus flower -->
  <g transform="translate(200,155)" opacity=".28">
    <ellipse cx="0" cy="0" rx="18" ry="44" fill="#ffffff" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="18" ry="44" fill="#ffffff" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="18" ry="44" fill="#ffffff" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="18" ry="44" fill="#ffffff" transform="rotate(-60)"/>
    <ellipse cx="0" cy="0" rx="18" ry="44" fill="#ffffff" transform="rotate(60)"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff"/>
  </g>
  <!-- Sun rays -->
  <g transform="translate(1050,90)" opacity=".22">
    <circle cx="0" cy="0" r="36" fill="#ffffff"/>
    <line x1="0" y1="-56" x2="0" y2="-46" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="46" x2="0" y2="56" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="-56" y1="0" x2="-46" y2="0" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="46" y1="0" x2="56" y2="0" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="-40" y1="-40" x2="-33" y2="-33" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="33" y1="-33" x2="40" y2="-40" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="-40" y1="40" x2="-33" y2="33" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="33" y1="33" x2="40" y2="40" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Heart -->
  <path d="M640,140 C640,120 620,100 600,110 C580,120 580,145 600,165 L640,200 L680,165 C700,145 700,120 680,110 C660,100 640,120 640,140 Z" fill="#ffffff" opacity=".20"/>
  <!-- Gentle arcs -->
  <path d="M300,240 Q480,200 660,230 Q840,260 1000,220" fill="none" stroke="#ffffff" stroke-width="3" opacity=".15" stroke-linecap="round"/>
</svg>
